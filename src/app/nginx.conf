server {
    listen 80;
    server_name _;
    root /usr/share/nginx/html;
    index index.html;

    # Backend allows up to max_upload_file_size_mb (100MB) per file and up to
    # max_concurrent_uploads (10) files per request (src/api/config.py). Without this,
    # nginx's default 1MB client_max_body_size silently 413s any real document/audio
    # upload proxied through here (private-networking mode) even though the backend
    # itself would accept it — this is the ONLY place enforcing that default, so size
    # it to the backend's worst case with headroom for multipart overhead.
    client_max_body_size 1024m;

    # Never cache the runtime config or the HTML shell so env changes apply on restart
    location = /runtime-config.js {
        add_header Cache-Control "no-cache, no-store, must-revalidate";
        expires -1;
    }
    location = /index.html {
        add_header Cache-Control "no-cache, no-store, must-revalidate";
        expires -1;
    }

    # Hashed build assets can be cached aggressively
    location /static/ {
        expires 1y;
        add_header Cache-Control "public, immutable";
    }

    # Reverse-proxy API calls to the backend App Service. Populated at container
    # startup from BACKEND_API_HOST (private-networking mode, where the backend
    # has no public endpoint); empty in public mode where the SPA calls the
    # backend URL directly.
    include /etc/nginx/conf.d/api-proxy.inc;

    # SPA fallback for client-side routing (React Router)
    location / {
        try_files $uri $uri/ /index.html;
    }
}
